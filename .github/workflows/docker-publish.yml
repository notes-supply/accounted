name: Build and Push Docker Image

# Builds each platform on its own native runner, then stitches the two into one
# manifest list.
#
# This was a single amd64 job emulating arm64 through QEMU and took ~31 minutes:
# QEMU translates every Arm instruction into x86, so the arm64 half ran several
# times slower than the amd64 half it shared a runner with. GitHub's free
# `ubuntu-24.04-arm` runners (public repos) remove the emulation entirely, and
# the two halves now run concurrently on their own hardware.
#
# The cost is a second job. A native single-platform build cannot produce a
# multi-platform manifest by itself, so each build pushes an untagged,
# digest-addressed image and `merge` composes the tag list from those digests
# with `imagetools create`. Tagging, signing, and scanning all belong to `merge`,
# because the digest consumers actually resolve is the manifest list's, not
# either platform's.
#
# This release-only wrapper is manually dispatched from its dedicated branch.
# Every build job checks out SOURCE_SHA rather than the wrapper commit, and the
# sole image tag is that full source identity. It cannot move `latest`.

on:
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: notes-supply/accounted
  SOURCE_SHA: e2c8fa15f4ae0c90166cf4ca44dd26a10ca1dcbf

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      # Publishing one architecture and silently dropping the other is worse
      # than publishing neither: the merge below needs both digests.
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # SOURCE_SHA is a hardcoded reviewed object, never event input.
          ref: ${{ env.SOURCE_SHA }}
          # The build pushes to GHCR via docker/login-action, never over git, so
          # the git credential is dead weight inside a Docker build context.
          persist-credentials: false

      - name: Verify frozen source identity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"

      - name: Log in to GHCR
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Labels only. Tags are applied once, to the manifest list, in `merge`.
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          labels: |
            org.opencontainers.image.source=https://github.com/notes-supply/accounted
            org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
            org.opencontainers.image.version=${{ env.SOURCE_SHA }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      # No setup-qemu-action. That was the whole point: each runner now builds
      # its own architecture natively.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            EXTENSIONS_PRESET=self-hosted
          # SBOM (software bill of materials) + SLSA provenance are attached as
          # OCI attestations, queryable via `docker buildx imagetools inspect`.
          provenance: mode=max
          sbom: true
          # push-by-digest publishes without a tag; `merge` collects the digests
          # and builds the tag list from them. name-canonical records the
          # repository name in the config so the merged manifest resolves.
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          # Layer cache lives in GHCR, not the GitHub Actions cache. Two
          # platforms x mode=max is ~7 GB, which alone ate 70% of the repo's
          # 10 GB Actions cache quota and, because buildx refreshes every blob's
          # access time on each run, never aged out under LRU: it starved the
          # other workflows' caches instead. GHCR storage is free for public
          # repos and off that quota. mode=max is kept deliberately: mode=min
          # would drop the deps/builder stages and make every push redo
          # `npm ci` + `next build`.
          #
          # The cache tag is now per-architecture. Each runner builds a single
          # platform, so a shared tag would leave the two jobs racing to
          # overwrite a cache manifest describing layers the other cannot use.
          #
          # A stable cache tag is safe here: this release wrapper is manually
          # dispatched and checks out one hardcoded, reviewed source commit. No
          # event-controlled ref can poison the layers.
          #
          # image-manifest=true,oci-mediatypes=true is required by GHCR, which
          # rejects buildkit's default cache manifest media type.
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-${{ matrix.arch }},mode=max,image-manifest=true,oci-mediatypes=true

      # Digests reach `merge` as artifact filenames: the file content is
      # irrelevant, only the name carries information.
      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          # A silently empty artifact would surface later as an imagetools
          # invocation with no source digests, which is a much worse error.
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge, sign and scan
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
      # OIDC token used by cosign keyless signing.
      id-token: write
      # SARIF upload to the repo's "Security" tab from the Trivy scan.
      security-events: write

    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Log in to GHCR
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # The sole candidate tag is the full frozen source commit. No mutable
          # or semver tag is moved by this release-only workflow.
          tags: |
            type=raw,value=${{ env.SOURCE_SHA }}

      - name: Create and push manifest list
        id: manifest
        working-directory: /tmp/digests
        run: |
          set -euo pipefail
          metadata="${RUNNER_TEMP}/manifest-metadata.json"
          mapfile -t tags < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          tag_args=()
          for tag in "${tags[@]}"; do
            tag_args+=("-t" "${tag}")
          done
          mapfile -t digests < <(printf '%s\n' *)
          source_args=()
          for digest in "${digests[@]}"; do
            source_args+=("${REGISTRY}/${IMAGE_NAME}@sha256:${digest}")
          done
          docker buildx imagetools create \
            "${tag_args[@]}" \
            --metadata-file "${metadata}" \
            "${source_args[@]}"

          DIGEST=$(jq -er \
            '."containerimage.descriptor".digest
             | select(test("^sha256:[0-9a-f]{64}$"))' \
            "${metadata}")
          echo "Created ${REGISTRY}/${IMAGE_NAME}@${DIGEST}"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      # Cosign and Trivy must address the manifest list, not either platform's
      # image: the list digest is what `docker pull` resolves for consumers, so
      # it is the thing worth signing and the thing worth scanning.

      - name: Verify both platforms are present
        id: platforms
        # A merge that quietly produced a single-arch manifest would ship a
        # broken image to every arm64 self-hoster, and nothing downstream checks
        # architecture. Assert it here while the digest is still in hand.
        env:
          DIGEST: ${{ steps.manifest.outputs.digest }}
        run: |
          set -euo pipefail
          PLATFORMS=$(docker buildx imagetools inspect \
            "${REGISTRY}/${IMAGE_NAME}@${DIGEST}" --raw \
            | jq -r '[.manifests[]
                      | select(.platform != null)
                      | select(.platform.os != "unknown")
                      | "\(.platform.os)/\(.platform.architecture)"]
                     | sort | unique | join(",")')
          echo "Manifest platforms: ${PLATFORMS}"
          [ "$PLATFORMS" = "linux/amd64,linux/arm64" ] || {
            echo "::error::Expected linux/amd64,linux/arm64 but got ${PLATFORMS}"
            exit 1
          }
          echo "platforms=${PLATFORMS}" >> "$GITHUB_OUTPUT"

      - name: Verify embedded SBOM and provenance attestations
        id: attestations
        env:
          DIGEST: ${{ steps.manifest.outputs.digest }}
        run: |
          set -euo pipefail
          raw=$(docker buildx imagetools inspect \
            "${REGISTRY}/${IMAGE_NAME}@${DIGEST}" --raw)
          mapfile -t attestations < <(jq -r '
            .manifests[]
            | select(.annotations["vnd.docker.reference.type"] == "attestation-manifest")
            | .digest' <<< "${raw}")
          [ "${#attestations[@]}" -ge 2 ] || {
            echo "::error::Expected per-platform attestation manifests"
            exit 1
          }

          sbom=0
          provenance=0
          for attestation in "${attestations[@]}"; do
            manifest=$(docker buildx imagetools inspect \
              "${REGISTRY}/${IMAGE_NAME}@${attestation}" --raw)
            sbom=$((sbom + $(jq '[.layers[]
              | select(.annotations["in-toto.io/predicate-type"] == "https://spdx.dev/Document")]
              | length' <<< "${manifest}")))
            provenance=$((provenance + $(jq '[.layers[]
              | select(.annotations["in-toto.io/predicate-type"]
                | startswith("https://slsa.dev/provenance/"))]
              | length' <<< "${manifest}")))
          done
          [ "${sbom}" -ge 2 ] || { echo "::error::Missing per-platform SPDX SBOM"; exit 1; }
          [ "${provenance}" -ge 2 ] || { echo "::error::Missing per-platform SLSA provenance"; exit 1; }
          echo "sbom=${sbom}" >> "$GITHUB_OUTPUT"
          echo "provenance=${provenance}" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the image (keyless OIDC)
        env:
          DIGEST: ${{ steps.manifest.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "${REGISTRY}/${IMAGE_NAME}@${DIGEST}"

      - name: Verify keyless signature
        env:
          DIGEST: ${{ steps.manifest.outputs.digest }}
        run: |
          set -euo pipefail
          cosign verify \
            --certificate-identity \
              "https://github.com/notes-supply/accounted/.github/workflows/docker-publish.yml@refs/heads/release/accounted-mfa-hotfix-image-20260816" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${REGISTRY}/${IMAGE_NAME}@${DIGEST}" >/dev/null

      - name: Scan exact image digest with Trivy
        id: trivy
        # Scan the immutable manifest digest resolved by this run. A tag-based
        # follow-up scan can race another run that republishes the same tag.
        # The image is already pushed, but a finding fails this publication run
        # and prevents it from being accepted for deployment.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.manifest.outputs.digest }}
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
          format: sarif
          limit-severities-for-sarif: true
          output: trivy-results.sarif

      - name: Record immutable candidate evidence
        env:
          DIGEST: ${{ steps.manifest.outputs.digest }}
          PLATFORMS: ${{ steps.platforms.outputs.platforms }}
          SBOM: ${{ steps.attestations.outputs.sbom }}
          PROVENANCE: ${{ steps.attestations.outputs.provenance }}
        run: |
          set -euo pipefail
          jq -n \
            --arg source "${SOURCE_SHA}" \
            --arg image "${REGISTRY}/${IMAGE_NAME}" \
            --arg tag "${SOURCE_SHA}" \
            --arg digest "${DIGEST}" \
            --arg platforms "${PLATFORMS}" \
            --argjson sbom "${SBOM}" \
            --argjson provenance "${PROVENANCE}" \
            '{source_commit:$source,image:$image,tag:$tag,digest:$digest,
              platforms:($platforms|split(",")),spdx_sbom_layers:$sbom,
              slsa_provenance_layers:$provenance,signature:"verified",
              trivy_fixable_high_critical:"passed"}' \
            > candidate-evidence.json
          cat candidate-evidence.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload candidate evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: accounted-candidate-${{ env.SOURCE_SHA }}
          path: candidate-evidence.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload Trivy results to GitHub Security tab
        # if: always(), evidence must reach the Security tab regardless of the
        # scan step's exit status. With the previous `outcome == 'success'` guard,
        # a Trivy/DB outage that errored the scan would silently drop findings.
        # Kept non-fatal (continue-on-error) so a missing SARIF or a Security-tab
        # hiccup can't redden an otherwise-good publish.
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy
